name: GTA AI Shorts Factory (Twitch Clips)

on:
  schedule:
    - cron: '7 7 * * *'   # 12:37 PM IST
    - cron: '30 13 * * *' # 7:00 PM IST
    - cron: '30 17 * * *'  # 11:00 PM IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-video-factory
  cancel-in-progress: false

jobs:
  produce-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache tiny-voca TTS, ASR model, and Playwright Chromium
        uses: actions/cache@v4
        with:
          path: |
            .cache
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-24.04-gta-tinyvoca-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-24.04-gta-tinyvoca-

      - name: Install Node dependencies & setup TTS/ASR
        run: |
          npm ci
          node scripts/setup-tts.mjs
          node scripts/setup-asr.mjs

      - name: Install Playwright Chromium + fonts (resilient)
        run: |
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::ForceIPv4=true"
          retry() {
            local n=1
            until "$@"; do
              if [ $n -ge 4 ]; then return 1; fi
              echo "Command failed (attempt $n/4); retrying in $((n * 5))s..."
              sleep $((n * 5))
              n=$((n + 1))
            done
          }

          retry sudo apt-get $APT_OPTS update || true
          sudo apt-get $APT_OPTS install -y --no-install-recommends --fix-missing \
            fonts-liberation fonts-noto-color-emoji fonts-dejavu-core || true

          if ! find ~/.cache/ms-playwright -maxdepth 2 -name 'chromium-*' 2>/dev/null | grep -q .; then
            retry npx playwright install chromium
          fi
          retry sudo npx playwright install-deps chromium

      - name: Install twitch-dl
        run: |
          python3 -m pip install --retries 5 --user --break-system-packages --upgrade twitch-dl
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/twitch-dl" --version

      - name: Restore YouTube OAuth credentials
        env:
          YT_CLIENT_SECRETS_B64: ${{ secrets.YT_CLIENT_SECRETS_B64 }}
          YT_TOKEN_JSON_B64: ${{ secrets.YT_TOKEN_JSON_B64 }}
        run: |
          echo "$YT_CLIENT_SECRETS_B64" | base64 --decode > client_secrets.json
          echo "$YT_TOKEN_JSON_B64" | base64 --decode > token.json

      - name: Generate and publish GTA Shorts
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_GAMES: 'Grand Theft Auto VI,Grand Theft Auto V'
          TWITCH_LOOKBACK_HOURS: '48'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: 'baidu/ernie-5.5-flash-preview:free'
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          REEL_MAX_SECONDS: '89'
          TZ: Asia/Kolkata
        run: node main.js --gta --random --publish all

      - name: Cleanup OAuth credentials
        if: always()
        run: rm -f client_secrets.json token.json

      - name: Commit history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p output
          if [ -f output/history.json ]; then
            git add -f output/history.json
            if git diff --cached --quiet; then
              echo "No history changes to commit."
            else
              git commit -m "chore: update GTA content history [skip ci]"
              git pull --rebase origin "${{ github.ref_name }}"
              git push
            fi
          else
            echo "No output/history.json produced this run."
          fi
