name: AI Content Factory

on:
  schedule:
    - cron: '30 1 * * *'   # 7:00 AM IST
    # - cron: '7 7 * * *'   # 12:37 PM IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-video-factory
  cancel-in-progress: false

jobs:
  produce-and-publish:
    # Pinned to 24.04 LTS to avoid flaky Ubuntu 26.04 (resolute) mirror 503 errors
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Caches TTS/ASR models (.cache/), Obscura (.cache/obscura/), and Playwright Chromium
      - name: Cache TTS/ASR models, Obscura, and Playwright browser
        uses: actions/cache@v4
        with:
          path: |
            .cache
            ~/.cache/ms-playwright
          key: factory-${{ runner.os }}-24.04-tinyvoca-v1
          restore-keys: |
            factory-${{ runner.os }}-24.04-tinyvoca-

      - name: Install npm dependencies
        run: |
          npm ci
          node scripts/setup-tts.mjs
          node scripts/setup-asr.mjs

      - name: Install Obscura (cached in .cache/obscura)
        run: |
          mkdir -p .cache/obscura
          if [ ! -x .cache/obscura/obscura ]; then
            curl -fSL --retry 5 --retry-delay 3 --retry-all-errors \
              https://github.com/h4ckf0r0day/obscura/releases/latest/download/obscura-x86_64-linux.tar.gz \
              -o /tmp/obscura.tar.gz
            tar -xzf /tmp/obscura.tar.gz -C .cache/obscura
            rm -f /tmp/obscura.tar.gz
            find .cache/obscura -type f \( -name 'obscura' -o -name 'obscura-worker' \) -exec chmod +x {} +
          fi
          OBSCURA_BIN="$(find "${{ github.workspace }}/.cache/obscura" -type f -name 'obscura' | head -n 1)"
          echo "OBSCURA_PATH=$OBSCURA_BIN" >> "$GITHUB_ENV"
          echo "$(dirname "$OBSCURA_BIN")" >> "$GITHUB_PATH"
          "$OBSCURA_BIN" --version || true

      - name: Install Playwright Chromium + system libraries (resilient)
        run: |
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::ForceIPv4=true"
          retry() {
            local n=1
            until "$@"; do
              if [ $n -ge 4 ]; then return 1; fi
              echo "Command failed (attempt $n/4); retrying in $((n * 5))s..."
              sleep $((n * 5))
              n=$((n + 1))
            done
          }

          # Update apt with retries; optional Noto fonts must never abort the job
          retry sudo apt-get $APT_OPTS update || true
          sudo apt-get $APT_OPTS install -y --no-install-recommends --fix-missing \
            fonts-noto-color-emoji fonts-noto-core || true

          # Skip re-downloading Chromium if restored from cache; still ensure OS deps exist
          if ! find ~/.cache/ms-playwright -maxdepth 2 -name 'chromium-*' 2>/dev/null | grep -q .; then
            retry npx playwright install chromium
          fi
          retry sudo npx playwright install-deps chromium

      - name: Restore YouTube OAuth files from Secrets
        env:
          YT_CLIENT_SECRETS_B64: ${{ secrets.YT_CLIENT_SECRETS_B64 }}
          YT_TOKEN_JSON_B64: ${{ secrets.YT_TOKEN_JSON_B64 }}
        run: |
          echo "$YT_CLIENT_SECRETS_B64" | base64 --decode > client_secrets.json
          echo "$YT_TOKEN_JSON_B64" | base64 --decode > token.json

      - name: Preflight environment check (diagnostics, never fails the job)
        run: node scripts/doctor.mjs

      - name: Run the factory (scout -> script -> render -> publish YT + IG -> cleanup)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: 'baidu/ernie-5.5-flash-preview:free'
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          REEL_MAX_SECONDS: '89'
          TZ: Asia/Kolkata
        run: node main.js --auto --random --publish all

      - name: Shred temporary OAuth files from runner disk
        if: always()
        run: rm -f client_secrets.json token.json

      - name: Commit updated output/history.json
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p output
          if [ -f output/history.json ]; then
            git add -f output/history.json
            if git diff --cached --quiet; then
              echo "history.json unchanged"
            else
              git commit -m "chore: update history.json after published short/reel [skip ci]"
              git pull --rebase origin "${{ github.ref_name }}"
              git push
            fi
          else
            echo "no output/history.json produced this run (pipeline failed before publish)"
          fi
