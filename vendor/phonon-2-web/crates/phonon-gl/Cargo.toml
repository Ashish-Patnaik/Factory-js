[package]
name = "phonon-gl"
description = "Phonon-2 FastConformer encoder on WebGL2 fragment shaders (float textures), for browsers without WebGPU"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
phonon-core = { path = "../phonon-core", default-features = false }
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "OffscreenCanvas", "WebGl2RenderingContext", "WebGlProgram", "WebGlShader", "WebGlTexture",
  "WebGlFramebuffer", "WebGlUniformLocation", "WebGlVertexArrayObject",
] }
