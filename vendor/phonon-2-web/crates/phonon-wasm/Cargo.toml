[package]
name = "phonon-wasm"
description = "Phonon-2 in the browser: wasm-bindgen API over phonon-core (CPU, threaded) and phonon-gpu (WebGPU)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["threads", "gpu", "webgl"]
threads = ["dep:wasm-bindgen-rayon", "phonon-core/parallel"]
gpu = ["dep:phonon-gpu"]
webgl = ["dep:phonon-gl"]

[dependencies]
phonon-core = { path = "../phonon-core", default-features = false }
phonon-gpu = { path = "../phonon-gpu", optional = true }
phonon-gl = { path = "../phonon-gl", optional = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde_json = "1"
wasm-bindgen-rayon = { version = "1.3", optional = true, features = ["no-bundler"] }
